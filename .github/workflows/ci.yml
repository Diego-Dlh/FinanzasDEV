name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: finanzasdev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finanzasdev
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      SEED_KEY: ci-seed-key-1234
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: CiAdminPassword123
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:unit
      - name: Migrations apply and match schema.prisma
        run: |
          npx prisma migrate deploy
          psql postgresql://postgres:postgres@localhost:5432/postgres -c 'CREATE DATABASE shadow'
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url postgresql://postgres:postgres@localhost:5432/shadow --exit-code
      - run: npm run build
      - name: e2e
        run: |
          npm start &
          npx --yes wait-on http-get://localhost:3000/api/health -t 60000 || npx --yes wait-on tcp:3000 -t 60000
          npm run test:e2e
