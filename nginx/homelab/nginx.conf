# =============================================================================
# Nginx para homelab — detrás de Cloudflare Tunnel.
# Solo HTTP: Cloudflare termina el HTTPS. Aquí: IP real, rate limiting y gzip.
# =============================================================================
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── IP real del visitante ────────────────────────────────────────────────
    # Las peticiones llegan desde el contenedor cloudflared (red Docker privada),
    # que envía la IP original en CF-Connecting-IP. Sin esto, el rate limiting
    # trataría a todos los usuarios como una sola IP.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   CF-Connecting-IP;

    # No registrar query strings: /api/admin/setup y /api/seed reciben ?key=...
    log_format main '$remote_addr [$time_local] "$request_method $uri" '
                    '$status $body_bytes_sent rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;
    client_max_body_size 1m;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1000;
    gzip_types text/plain text/css text/javascript application/json
               application/javascript application/xml image/svg+xml;

    # ─── Rate limiting ────────────────────────────────────────────────────────
    # auth: protege login/registro contra fuerza bruta.
    # api:  holgado — cada página hace varias llamadas en paralelo.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=10r/s;

    # Resolver interno de Docker (resuelve "app" aunque se recree el contenedor)
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80 default_server;
        server_name _;

        set $upstream http://app:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;

        location = /api/auth/login {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;
            proxy_pass $upstream;
        }

        location = /api/auth/register {
            limit_req zone=auth burst=3 nodelay;
            limit_req_status 429;
            proxy_pass $upstream;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            limit_req_status 429;
            proxy_pass $upstream;
        }

        location /_next/static/ {
            proxy_pass $upstream;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location / {
            proxy_pass $upstream;
        }
    }
}
